<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>나노의책장 독서 포트폴리오 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --bg-page: #f1f5f9;
    --leaf: #1f8a7e;
    --leaf-dark: #145951;
    --text-main: #1e293b;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    font-family: Pretendard, -apple-system, sans-serif;
    color: var(--text-main);
  }
  .report-topbar {
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 800;
    color: var(--leaf-dark);
  }
  .btn-print {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #475569;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .portfolio-wrapper {
    max-width: 820px;
    margin: 24px auto 60px;
    padding: 0 16px;
  }
  .doc-sheet {
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    padding: 32px 30px;
  }
  .pf-hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .pf-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 18px;
    margin-bottom: 24px;
  }
  .pf-title-row h1 {
    font-size: 24px;
    font-weight: 900;
    color: #0f172a;
    margin: 0;
    letter-spacing: -0.03em;
  }
  .pf-period-text {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .pf-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    background: #f8fafc;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 26px;
  }
  .pf-meta-item small {
    display: block;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .pf-meta-item strong {
    font-size: 14px;
    color: #1e293b;
  }
  .pf-section {
    margin-bottom: 30px;
  }
  .pf-section h2 {
    font-size: 16px;
    font-weight: 800;
    color: var(--leaf-dark);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .insight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 12px;
  }
  .insight-card {
    background: #fdfefe;
    border: 1px solid #e2e8f0;
    border-left: 4px solid var(--leaf);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .insight-card .cat {
    font-size: 12px;
    font-weight: 800;
    color: var(--leaf-dark);
    margin-bottom: 4px;
  }
  .insight-card .txt {
    font-size: 12.5px;
    line-height: 1.6;
    color: #334155;
    margin: 0;
  }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .book-item-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-align: center;
    padding-bottom: 10px;
  }
  .book-item-card img {
    width: 100%;
    aspect-ratio: 1 / 1.35;
    object-fit: cover;
    background: #f1f5f9;
  }
  .book-item-card .b-title {
    font-size: 12px;
    font-weight: 800;
    color: #1e293b;
    margin: 8px 6px 2px;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .book-item-card .b-score {
    font-size: 11px;
    font-weight: 700;
    color: var(--leaf);
  }
  .teacher-total-note {
    background: linear-gradient(135deg, #fefce8 0%, #fffbeb 100%);
    border: 1.5px solid #fef08a;
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #713f12;
    white-space: pre-wrap;
  }
  .msg-center {
    text-align: center;
    padding: 90px 20px;
    color: var(--text-muted);
  }
  @media print {
    .report-topbar { display: none !important; }
    body { background: #fff !important; }
    .portfolio-wrapper { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
    .doc-sheet { box-shadow: none !important; border: none !important; padding: 0 !important; }
  }
</style>
<link rel="stylesheet" href="css/portfolio-public.css?v=20261111-editorial">
</head>
<body>
<div class="report-topbar">
  <div class="brand-logo">
    <i class="fa-solid fa-graduation-cap"></i>
    <span>나노의책장 독서 포트폴리오</span>
  </div>
  <button type="button" class="btn-print" onclick="window.print()">
    <i class="fa-solid fa-print mr-1"></i>인쇄 / PDF 저장
  </button>
</div>

<main class="portfolio-wrapper" id="portfolioView">
  <div class="msg-center">
    <i class="fa-solid fa-spinner fa-spin fa-2x mb-3" style="color:var(--leaf);"></i>
    <p>포트폴리오 리포트를 불러오는 중입니다...</p>
  </div>
</main>

<script>
(async function() {
  var view = document.getElementById('portfolioView');
  var params = new URLSearchParams(location.search);
  var pfId = params.get('pf') || '';
  var token = params.get('t') || '';

  if (!pfId) {
    view.innerHTML = '<div class="msg-center"><h3>포트폴리오 정보가 없습니다.</h3><p>알림톡 링크를 다시 확인해 주세요.</p></div>';
    return;
  }

  try {
    var res = await fetch('/api/services?action=public_portfolio&pf=' + encodeURIComponent(pfId) + '&t=' + encodeURIComponent(token));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '포트폴리오를 불러올 수 없습니다.');

    var pf = data.portfolio || {};
    var books = pf.books || [];
    var insights = pf.aiInsights || pf.insights || [];
    var teacherNote = pf.comment || pf.aiTeacherNote || pf.teacherNote || '';
    if (!insights.length && Array.isArray(pf.aiComments)) {
      insights = pf.aiComments.map(function(comment, index) { return { category: ['문해력과 이해', '공감과 정서', '비판적 사고', '표현과 독서 태도'][index] || '독서 관찰', comment: comment }; });
    }
    var scores = books.map(function(book) { return book.score == null || book.score === '' ? NaN : Number(String(book.score).replace(/점$/, '')); }).filter(Number.isFinite);
    var average = pf.quizAvg != null ? Number(pf.quizAvg) : (scores.length ? scores.reduce(function(a, b) { return a + b; }, 0) / scores.length : NaN);

    var booksHtml = books.map(function(b) {
      return `
        <div class="book-item-card">
          <img src="${escapeHtml(b.cover || 'resources/images/book_default.svg')}" alt="${escapeHtml(b.title)}" onerror="this.onerror=null;this.src='resources/images/book_default.svg'">
          <div class="b-title">${escapeHtml(b.title)}</div>
          <div class="b-score">${b.score == null || b.score === '' ? '기록 없음' : escapeHtml(String(b.score).replace(/점$/, '')) + '점'}</div>
          <div class="book-byline">${escapeHtml([b.author, b.pub || b.publisher].filter(Boolean).join(' · '))}</div>
          ${b.achievement ? `<div class="book-achievement">${escapeHtml(b.achievement)}</div>` : ''}
        </div>
      `;
    }).join('');

    var insightsHtml = insights.map(function(ins) {
      return `
        <div class="insight-card">
          <div class="cat"><i class="${escapeHtml(ins.icon || 'fa-solid fa-star')} mr-1"></i>${escapeHtml(ins.category || '독서 역량')}</div>
          <p class="txt">${escapeHtml(ins.comment || '')}</p>
        </div>
      `;
    }).join('');

    var html = `
      <div class="doc-sheet">
        <div class="pf-hero-badge">
          <i class="fa-solid fa-medal"></i>
          <span>독서 성장 포트폴리오</span>
        </div>
        <div class="pf-title-row">
          <div>
            <h1>${escapeHtml(pf.name || '원생')} 학생의 독서 기록</h1>
            <div class="pf-period-text"><i class="fa-regular fa-calendar mr-1"></i>분석 기간: ${escapeHtml(pf.from || '')} ~ ${escapeHtml(pf.to || '')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:12px;color:var(--text-muted);">발행처</div>
            <strong style="color:var(--leaf-dark);font-size:15px;">${escapeHtml(pf.academyName || '나노의책장 가맹원')}</strong>
          </div>
        </div>

        <div class="pf-meta-grid">
          <div class="pf-meta-item">
            <small>완독 도서수</small>
            <strong style="color:var(--leaf);">${books.length}권</strong>
          </div>
          <div class="pf-meta-item">
            <small>북퀴즈 평균</small>
            <strong>${Number.isFinite(average) ? Math.round(average) + '점' : '기록 없음'}</strong>
          </div>
          <div class="pf-meta-item">
            <small>학년 / 학급</small>
            <strong>${escapeHtml(pf.grade || '')} ${escapeHtml(pf.classGroup || '')}</strong>
          </div>
          <div class="pf-meta-item">
            <small>지도교사</small>
            <strong>${escapeHtml(pf.teacher || '담당 교사')}</strong>
          </div>
        </div>

        ${insights.length > 0 ? `
          <div class="pf-section">
            <h2><i class="fa-solid fa-brain"></i>독서에서 발견한 성장</h2>
            <div class="insight-grid">${insightsHtml}</div>
          </div>
        ` : ''}

        <div class="pf-section pf-record-section">
          <h2><i class="fa-solid fa-book"></i>기간 내 완독 도서 (${books.length}권)</h2>
          <div class="book-grid">${booksHtml || '<div class="portfolio-empty">이 기간에 등록된 완독 도서가 없습니다.</div>'}</div>
        </div>

        ${teacherNote ? `
          <div class="pf-section">
            <h2><i class="fa-solid fa-heart"></i>선생님의 한마디</h2>
            <div class="teacher-total-note">${escapeHtml(teacherNote)}</div>
          </div>
        ` : ''}
      </div>
    `;

    view.innerHTML = html;
  } catch(err) {
    view.innerHTML = '<div class="msg-center"><h3 style="color:#ef4444;">포트폴리오를 불러오지 못했습니다</h3><p>' + escapeHtml(err.message) + '<br><small>링크가 올바른지 학원에 문의해 주세요.</small></p></div>';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
})();
</script>
</body>
</html>
