<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/normalize.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/sub.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script src="../../js/common.js"></script>
	<title>나노의책장</title>
</head>
<body>
	<div id="wrap">
		
		<!-- contents -->
		<div class="contents">
			<!-- 북퀴즈 -->
			<div class="full_popup bookquiz">
				<!-- popup header -->
				<div class="popup_header">
					<div class="inner">
						<h2 class="header_title">북퀴즈</h2>
					</div>
				</div>
				<!-- // popup header -->

				<!-- popup contents -->
				<div class="popup_contents">
					<!-- 책 추천화면 -->
					<div class="book_recommend">
						<h3 class="title">이 책을 다른 친구들에게도<br>추천하겠습니까?</h3>
						<div class="btn_area">
							<a href="#" class="btn_recommend"><i class="icon_recommend"></i><span class="text">추천해요!</span></a>
							<a href="#" class="btn_recommend"><i class="icon_not_recommend"></i><span class="text">추천하지 않아요!</span></a>
						</div>
					</div>
					<!-- // 책 추천화면 -->
				</div>
				<!-- // popup contents -->
				
				<!-- popup footer -->
				<div class="popup_footer">
					<div class="btn_area">
						<a href="#" class="btn_next btn_full"><span>퀴즈 결과 보러 가기</span><i class="icon_back"></i></a>
					</div>
				</div>
				<!-- // popup footer -->
			</div>
			<!-- // 북퀴즈 -->
		</div>
		<!-- // contents -->
	</div>
</body>
</html>
