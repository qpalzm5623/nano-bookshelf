<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/normalize.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/sub.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script src="../../js/common.js"></script>
	<title>나노의책장</title>
</head>
<body>
	<div id="wrap">

		<!-- contents -->
		<div class="contents">
			
			<!-- 본인확인 팝업 -->
			<div class="layer_popup_wrap identification" style="display:block;">
				<div class="layer_popup">
					<div class="popup_header">
						<h2 class="popup_title">
							<div class="logo"><img src="../../images/common/logo.png" alt=""></div>을 시작하려면 본인 인증이 필요합니다.
						</h2>
					</div>
					<div class="popup_contents">
						<div class="scroll_contents">
							<!-- 본인확인 폼 -->
							<ul class="form_area">
								<li class="form_box">
									<div class="form_title">이름</div>
									<div class="input_box square readonly"><input type="text" value="김나노" readonly></div>
								</li>
								<li class="form_box">
									<strong class="form_title">휴대폰 번호</strong>
									<div class="input_box square readonly"><input type="text" value="010-1234-1234" readonly></div>
								</li>
								<li class="form_box">
									<strong class="form_title">성별 / 나이</strong>
									<div class="input_area">
										<div class="input_box square readonly"><input type="text" value="김나노" readonly></div>
										<div class="input_box square readonly"><input type="text" value="김나노" readonly></div>
									</div>
								</li>
								<li class="form_box">
									<strong class="form_title">반 / 담당 선생님</strong>
									<div class="input_area">
										<div class="input_box square readonly"><input type="text" value="A" readonly></div>
										<div class="input_box square readonly"><input type="text" value="홍길동" readonly></div>
									</div>
								</li>
								<li class="form_box">
									<strong class="form_title">관심 주제 선택 (3개)</strong>
									<div class="check_area">
										<div class="check_button">
											<input type="checkbox" id="check1">
											<label for="check1">생물</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">자연</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">초자연</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">사람/관계</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">공간</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">사건</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">꿈/직업</label>
										</div>
										<div class="check_button">
											<input type="checkbox" id="check2">
											<label for="check2">기술</label>
										</div>
									</div>
								</li>
							</ul>
							<!-- // 본인확인 폼 -->
						</div>
					</div>
					<div class="popup_btn_area">
						<a href="#" class="btn popup_close">저 장</a>
					</div>
				</div>
			</div>
			<!-- // 본인확인 팝업 -->

		</div>
		<!-- // contents -->
	</div>
</body>
</html>
