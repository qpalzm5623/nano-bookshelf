<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/normalize.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/sub.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<title>나노의책장</title>
</head>
<body>
	<div id="wrap">
		<h1 class="hidden">내책장</h1>
		<!-- header -->
		<header class="sub_header">
			<div class="inner">
				<a href="#" class="btn_back"><i class="icon_back"></i>이전</a>
				<h2 class="header_title">비밀번호 변경</h2>
			</div>
		</header>

		<!-- contents -->
		<div id="contents" class="contents">
			<!-- 비밀번호 변경 -->
			<div class="change_password form_wrap">
				<ul class="form_area">
					<li class="form_box">
						<strong class="form_title">기존 비밀번호</strong>
						<div class="input_box"><input type="password" placeholder="비밀번호를 입력해 주세요."><button class="input_view">비밀번호 보기</button><!-- <button class="input_view on">비밀번호 보기</button>--></div>
					</li>
					<li class="form_box">
						<strong class="form_title">새 비밀번호</strong>
						<div class="input_box"><input type="password" placeholder="비밀번호를 입력해 주세요."><button class="input_view">비밀번호 보기</button><!-- <button class="input_view on">비밀번호 보기</button>--></div>
					</li>
					<li class="form_box">
						<strong class="form_title">새 비밀번호 확인</strong>
						<div class="input_box"><input type="password" placeholder="비밀번호를 입력해 주세요."><button class="input_view">비밀번호 보기</button><!-- <button class="input_view on">비밀번호 보기</button>--></div>
					</li>
				</ul>
				<button class="btn_basic bg_blue_green">비밀번호 변경</button>
			</div>
			<!-- // 비밀번호 변경 -->
		</div>
		<!-- // contents -->

		<nav class="nav">
			<ul class="nav_list">
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">홈</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">검색</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">랭킹</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">책장</span>
					</a>
				</li>
				<li class="nav_item on">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">관리</span>
					</a>
				</li>
			</ul>
		</nav>
	</div>
</body>
</html>
