<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/normalize.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/sub.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script src="../../js/common.js"></script>
	<title>나노의책장</title>
</head>
<body>
	<div id="wrap">
		<!-- header -->
		<header class="sub_header">
			<div class="inner">
				<a href="#" class="btn_back"><i class="icon_back"></i>이전</a>
				<h2 class="header_title">내 책장</h2>
			</div>
		</header>

		<!-- contents -->
		<div id="contents" class="contents">

			<!-- 내 책장 -->
			<div class="my_bookcase_wrap bookcase_main">
				<div class="title_explain inner">
					<div class="title_image"><img src="../../images/common/symbol.png" alt=""></div>
					<h3>김나노의 책장</h3>
				</div>

				<div class="bookcase_info_area">
					<div class="inner">
						<div class="bookcase_info">
							<div class="info_title">
								<i class="icon"></i>
								인증완료
							</div>
							<strong class="count">27</strong>
						</div>
						<div class="bookcase_info">
							<div class="info_title">
								<i class="icon"></i>
								찜
							</div>
							<strong class="count">125</strong>
						</div>
						<div class="bookcase_info">
							<div class="info_title">
								<i class="icon"></i>
								내가 푼 문제
							</div>
							<strong class="count">2741</strong>
						</div>
					</div>
				</div>

				<div class="title_box inner">
					<h3 class="title">관심 주제</h3>
					<a href="#" class="btn_more">수정하기</a>
				</div>
					
				<div class="inner">
					<div class="info_box">
						<ul class="info_list">
							<li class="info_item info_content">사람/관계</li>
							<li class="info_item info_content">꿈/직업</li>
							<li class="info_item info_content">공간</li>
						</ul>
					</div>
				</div>
						
				<ul class="menu_link_list">
					<li class="menu_link">
						<a href="#" class="inner">
							<strong class="menu_title">독서 인증 기록</strong>
							<span class="menu_text">나의 독서 인증 기록을 확인할 수 있습니다.</span>
						</a>
					</li>
					<li class="menu_link">
						<a href="#" class="inner">
							<strong class="menu_title">찜한 책</strong>
						</a>
					</li>
				</ul>

				<div class="title_box inner">
					<h3 class="title">나의 독서 취향</h3>
					<div class="filter">
						<a href="#" class="btn font_orange">최근 7일간</a>
						<a href="#" class="btn">전체</a>
					</div>
				</div>

				<div class="graph inner">그래프</div>

			</div>
			<!-- // 내 책장 -->

		</div>
		<!-- // contents -->
	</div>
</body>
</html>
