<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/normalize.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/sub.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script src="../../js/common.js"></script>
	<title>나노의책장</title>
</head>
<body>
	<div id="wrap">
		<!-- header -->
		<header class="sub_header">
			<div class="inner">
				<a href="#" class="btn_back"><i class="icon_back"></i>이전</a>
				<h2 class="header_title">관심 주제 수정</h2>
			</div>
		</header>

		<!-- contents -->
		<div id="contents" class="contents">
			<div class="inner">

				<!-- 관심 주제 수정 -->
				<div class="my_bookcase_wrap modify_interest_topic">

					<div class="title_explain">
						<h3>관심있는 주제를 3개 선택해 주세요.<br><strong class="font_blue_green">맞춤 도서를 추천</strong>해 드립니다. </h3>
					</div>
					
					<!-- 관심 주제 수정 목록 -->
					<div class="check_area">
						<div class="check_button lg">
							<input type="checkbox" id="check1">
							<label for="check1">생물</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check2">
							<label for="check2">자연</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check3">
							<label for="check3">초자연</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check4">
							<label for="check4">사람/관계</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check5">
							<label for="check5">공간</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check6">
							<label for="check6">사건</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check7">
							<label for="check7">꿈/직업</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check8">
							<label for="check8">기술</label>
						</div>
						<div class="check_button lg">
							<input type="checkbox" id="check9">
							<label for="check9">그외</label>
						</div>
					</div>
					<!-- // 관심 주제 수정 목록 -->

					<div class="btn_area">
						<button class="btn_basic bg_blue_green">저장</button>
					</div>
				</div>
				<!-- // 관심 주제 수정 -->

			</div>
		</div>
		<!-- // contents -->
		
		<!-- navigation -->
		<nav class="nav">
			<ul class="nav_list">
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">홈</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">검색</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">랭킹</span>
					</a>
				</li>
				<li class="nav_item on">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">책장</span>
					</a>
				</li>
				<li class="nav_item">
					<a href="#">
						<i class="item_icon"></i>
						<span class="item_title">관리</span>
					</a>
				</li>
			</ul>
		</nav>
		<!-- // navigation -->
	</div>
</body>
</html>
