<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>나노의책장 초등 문해력 진단 결과지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/literacy-report.css?v=20261105_layout">
<style>
  body { margin: 0; background: #f1f5f9; font-family: Pretendard, -apple-system, 'Malgun Gothic', sans-serif; }
  .bar { max-width: 794px; margin: 24px auto 0; padding: 0 4px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .bar .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .bar button { min-height: 44px; border: 1px solid #bad2cd; background: #fff; color: #145951; font-family: inherit; font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: 8px; cursor: pointer; transition: background .2s; }
  .bar button:focus-visible { outline: 3px solid #145951; outline-offset: 3px; }
  .bar button:hover { background: #e6f7f4; }
  .bar button.on { background: #1f8a7e; color: #fff; }
  .msg { max-width: 560px; margin: 80px auto; text-align: center; color: #64748b; padding: 0 20px; }
  @media screen and (max-width: 640px) { .bar { margin: 16px 12px 0; } #viewer { padding: 0 8px; } }
  @media print { body { background: #fff !important; } .bar { display: none !important; } }
</style>
</head>
<body>
<div id="viewer"><p class="msg">결과지를 불러오는 중입니다…</p></div>
<script src="js/literacy/literacy-common.js?v=20261105_layout"></script>
<script>
// 학부모 공유 링크 뷰어: 로그인 없이 서명된 링크(r=결과ID, t=토큰)로만 결과지를 열람합니다.
(async function () {
  var box = document.getElementById('viewer');
  var q = new URLSearchParams(location.search);
  try {
    var data = await NanoLiteracy.api('public_report', { params: { id: q.get('r') || '', t: q.get('t') || '' } });
    var rec = data.record, history = data.history || [];
    function draw(mode) {
      box.innerHTML = '<div class="bar"><span style="color:#4b606b;font-size:14px">' + NanoLiteracy.esc(rec.student.name) + ' 학생 결과지</span><span class="actions">' +
        '<button class="' + (mode === 'regular' ? 'on' : '') + '" aria-pressed="' + (mode === 'regular') + '" data-m="regular">정기진단용 · 2장</button> ' +
        '<button class="' + (mode === 'consult' ? 'on' : '') + '" aria-pressed="' + (mode === 'consult') + '" data-m="consult">신규상담용 · 1장</button> ' +
        '<button onclick="window.print()">인쇄 / PDF 저장</button></span></div>' + NanoLiteracy.renderReport(rec, history, mode);
      box.querySelectorAll('[data-m]').forEach(function (b) { b.onclick = function () { draw(b.getAttribute('data-m')); }; });
    }
    draw('regular');
  } catch (e) {
    box.innerHTML = '<p class="msg">' + NanoLiteracy.esc(e.message || '결과지를 열 수 없습니다.') + '<br><small>링크가 올바른지 학원에 문의해 주세요.</small></p>';
  }
})();
</script>
</body>
</html>
